nameOverride: ""
fullnameOverride: ""

## Backend Service Anubis should protect.
target:
  service:
    name: ""
    port: 80

anubis:
  image:
    repository: ghcr.io/techarohq/anubis
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Container port exposed by the Anubis HTTP server.
  port: 8923
  metrics:
    # Enable the Anubis metrics endpoint inside the pod.
    enabled: true
    port: 9090
    service:
      # Expose metrics on a dedicated Service for Prometheus scraping.
      enabled: false
      type: ClusterIP
      port: 9090
      annotations: {}
      labels: {}
  # Override the computed backend URL when TARGET needs a custom value.
  targetOverride: ""
  # Mount path for inline or existing ConfigMap policy files.
  policyFile: /etc/anubis/botPolicies.yaml
  # Extra environment variables passed directly to the Anubis container.
  # These apply to all modes (proxy and forwardAuth).
  # Note: Kubernetes uses last-env-wins semantics. If you duplicate a variable
  # that the chart already sets (e.g. REDIRECT_DOMAINS, COOKIE_DOMAIN), the
  # value from envExtra takes precedence over the structured configuration.
  # https://anubis.techaro.lol/docs/admin/configuration/redirect-domains
  #
  envExtra:
    - name: DIFFICULTY
      value: "4"
    - name: SERVE_ROBOTS_TXT
      value: "true"
    - name: OG_PASSTHROUGH
      value: "true"
    - name: OG_EXPIRY_TIME
      value: 24h
  keys:
    # Secret containing ED25519_PRIVATE_KEY_HEX.
    existingSecret: ""
  # configs
  # https://anubis.techaro.lol/docs/admin/installation#configuration
  # Inline botPolicies.yaml content.
  config: ""
  # Existing ConfigMap providing botPolicies.yaml.
  existingConfigMap: ""
  resources:
    limits:
      cpu: 750m
      memory: 256Mi
    requests:
      cpu: 250m
      memory: 256Mi
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

service:
  # Main HTTP Service exposed to Ingress or Gateway backends.
  type: ClusterIP
  port: 80

networkPolicy:
  # Allow HTTP ingress by default when enabled. Metrics stay closed unless
  # networkPolicy.metrics.from is configured.
  enabled: false
  metrics:
    # Standard NetworkPolicy peers allowed to reach the metrics port.
    from: []

ingress:
  # Create an Ingress that points to the main Anubis Service.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

gateway:
  # Create an HTTPRoute that points to the main Anubis Service.
  enabled: false
  parentRefs:
  hostnames:

# Operating mode: "proxy" (default) or "forwardAuth".
# In proxy mode, Anubis acts as a reverse proxy (Ingress/HTTPRoute → Anubis → workload).
# In forwardAuth mode, Traefik consults Anubis for auth checks before routing to the workload.
mode: proxy

forwardAuth:
  # Domains Anubis can redirect to (supports globs). Defaults to traefik host.
  redirectDomains: []
  # Cookie domain for the challenge cookie. Defaults to traefik host.
  cookieDomain: ""
  traefik:
    # Public hostname used for Traefik routing and Anubis REDIRECT_DOMAINS/COOKIE_DOMAIN.
    host: ""
    # Traefik entry points for the generated IngressRoute.
    entryPoints:
      - websecure
    # Secret name for TLS on the IngressRoute.
    tlsSecret: ""
    bypassRoute:
      # Generate a bypass IngressRoute for Anubis challenge asset paths (/.within.website/).
      enabled: true
    ingressRoute:
      # Annotations applied to the generated IngressRoute.
      annotations: {}
      # Extra routes appended to the generated IngressRoute.
      extraRoutes: []
        # - kind: Rule
        #   match: "Host(`example.com`) && PathPrefix(`/api`)"
        #   services:
        #     - name: api-service
        #       port: 80
    middleware:
      # Annotations applied to the generated Middleware.
      annotations: {}
      # Middleware-level fields (e.g., maxResponseBodySize). Rendered at spec level.
      spec: {}
        # maxResponseBodySize: 8192
      # forwardAuth-level fields merged into spec.forwardAuth.
      forwardAuth: {}
        # trustForwardHeader: true
