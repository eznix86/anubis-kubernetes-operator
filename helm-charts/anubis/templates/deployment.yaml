apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anubis.fullname" . }}
  labels:
    {{- include "anubis.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.anubis.replicas | default 1 }}
  {{- with .Values.anubis.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "anubis.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.anubis.config .Values.anubis.podAnnotations }}
      annotations:
        {{- with .Values.anubis.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.anubis.config }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "anubis.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.anubis.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.anubis.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: anubis
          image: "{{ .Values.anubis.image.repository }}:{{ .Values.anubis.image.tag }}"
          imagePullPolicy: {{ .Values.anubis.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.anubis.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $target := printf "http://%s.%s.svc.cluster.local:%v" .Values.target.service.name .Release.Namespace .Values.target.service.port }}
          env:
            {{- if eq .Values.mode "forwardAuth" }}
            - name: TARGET
              value: " "
            - name: PUBLIC_URL
              value: {{ printf "https://%s" .Values.forwardAuth.traefik.host | quote }}
            - name: BIND
              value: {{ printf ":%v" .Values.anubis.port | quote }}
            - name: REDIRECT_DOMAINS
              {{- if .Values.forwardAuth.redirectDomains }}
              value: {{ join "," .Values.forwardAuth.redirectDomains | quote }}
              {{- else }}
              value: {{ .Values.forwardAuth.traefik.host | quote }}
              {{- end }}
            - name: COOKIE_DOMAIN
              {{- if .Values.forwardAuth.cookieDomain }}
              value: {{ .Values.forwardAuth.cookieDomain | quote }}
              {{- else }}
              value: {{ .Values.forwardAuth.traefik.host | quote }}
              {{- end }}
            {{- else }}
            - name: TARGET
              value: {{ default $target .Values.anubis.targetOverride | quote }}
            - name: BIND
              value: {{ printf ":%v" .Values.anubis.port | quote }}
            {{- end }}
            {{- if .Values.anubis.metrics.enabled }}
            - name: METRICS_BIND
              value: {{ printf ":%v" .Values.anubis.metrics.port | quote }}
            {{- end }}
            {{- if or .Values.anubis.config .Values.anubis.existingConfigMap }}
            - name: POLICY_FNAME
              value: {{ .Values.anubis.policyFile | quote }}
            {{- end }}
            {{- if .Values.anubis.keys.existingSecret }}
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.anubis.keys.existingSecret }}
                  key: ED25519_PRIVATE_KEY_HEX
            {{- end }}
            {{- with .Values.anubis.envExtra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.anubis.port }}
            {{- if .Values.anubis.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.anubis.metrics.port }}
            {{- end }}
          {{- if eq .Values.mode "forwardAuth" }}
          livenessProbe:
            exec:
              command:
                - anubis
                - --healthcheck
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - anubis
                - --healthcheck
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- end }}
          {{- with .Values.anubis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if or .Values.anubis.config .Values.anubis.existingConfigMap }}
            - name: anubis-policy
              mountPath: {{ dir .Values.anubis.policyFile | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.anubis.persistence.enabled }}
            - name: anubis-data
              mountPath: {{ .Values.anubis.persistence.mountPath | quote }}
            {{- end }}
      volumes:
        {{- if or .Values.anubis.config .Values.anubis.existingConfigMap }}
        - name: anubis-policy
          configMap:
            name: {{ if .Values.anubis.config }}{{ include "anubis.fullname" . }}-policy{{ else }}{{ .Values.anubis.existingConfigMap }}{{ end }}
        {{- end }}
        {{- if .Values.anubis.persistence.enabled }}
        - name: anubis-data
          {{- if .Values.anubis.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.anubis.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "anubis.fullname" . }}-data
          {{- end }}
        {{- end }}
